<!--
  ============================================================
  EmailJS template for the portfolio contact form
  ============================================================

  HOW TO USE
  1. EmailJS Dashboard → Email Templates → Create New Template.
  2. In the "Content" tab, click the "</>" (Code editor) button and paste
     the full HTML below (everything from <!DOCTYPE html> down).
  3. In the template SETTINGS (right-hand panel), set:
       Subject:    New message from {{from_name}}: {{subject}}
       To Email:   faizanjaved5565@gmail.com
       From Name:  Portfolio Contact
       Reply To:   {{reply_to}}
  4. Save. Copy the Template ID into your .env as VITE_EMAILJS_TEMPLATE_ID.

  Variables used (must match src/services/emailjs.ts exactly):
    {{from_name}}  {{reply_to}}  {{subject}}  {{message}}
  ============================================================
-->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New portfolio message</title>
  </head>
  <body style="margin:0; padding:0; background-color:#0b1120; font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#0b1120; padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px; background-color:#0f172a; border-radius:16px; overflow:hidden; border:1px solid #1e293b;">
            <!-- Header -->
            <tr>
              <td style="background-image:linear-gradient(120deg,#3B82F6 0%,#8B5CF6 50%,#06B6D4 100%); padding:28px 32px;">
                <p style="margin:0; font-size:13px; letter-spacing:1px; text-transform:uppercase; color:rgba(255,255,255,0.85);">Portfolio Contact</p>
                <h1 style="margin:6px 0 0; font-size:22px; color:#ffffff; font-weight:700;">New message received</h1>
              </td>
            </tr>

            <!-- Body -->
            <tr>
              <td style="padding:32px;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                  <tr>
                    <td style="padding-bottom:18px;">
                      <p style="margin:0 0 4px; font-size:12px; text-transform:uppercase; letter-spacing:0.5px; color:#94a3b8;">From</p>
                      <p style="margin:0; font-size:16px; color:#f8fafc; font-weight:600;">{{from_name}}</p>
                      <p style="margin:2px 0 0; font-size:14px;">
                        <a href="mailto:{{reply_to}}" style="color:#8B5CF6; text-decoration:none;">{{reply_to}}</a>
                      </p>
                    </td>
                  </tr>
                  <tr>
                    <td style="padding-bottom:18px;">
                      <p style="margin:0 0 4px; font-size:12px; text-transform:uppercase; letter-spacing:0.5px; color:#94a3b8;">Subject</p>
                      <p style="margin:0; font-size:16px; color:#f8fafc;">{{subject}}</p>
                    </td>
                  </tr>
                  <tr>
                    <td>
                      <p style="margin:0 0 8px; font-size:12px; text-transform:uppercase; letter-spacing:0.5px; color:#94a3b8;">Message</p>
                      <div style="background-color:#111827; border:1px solid #1e293b; border-radius:12px; padding:18px; font-size:15px; line-height:1.6; color:#e2e8f0; white-space:pre-wrap;">{{message}}</div>
                    </td>
                  </tr>
                </table>

                <!-- Reply button -->
                <table role="presentation" cellpadding="0" cellspacing="0" style="margin-top:26px;">
                  <tr>
                    <td style="border-radius:9999px; background-image:linear-gradient(120deg,#3B82F6,#8B5CF6);">
                      <a href="mailto:{{reply_to}}?subject=RE: {{subject}}"
                         style="display:inline-block; padding:12px 26px; font-size:14px; font-weight:600; color:#ffffff; text-decoration:none;">
                        Reply to {{from_name}}
                      </a>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <!-- Footer -->
            <tr>
              <td style="padding:20px 32px; border-top:1px solid #1e293b;">
                <p style="margin:0; font-size:12px; color:#64748b;">
                  Sent from the contact form on syedfaizanjaved.vercel.app
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
